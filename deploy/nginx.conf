server {
  listen 80 default_server;
  listen [::]:80 default_server;

  root /usr/share/nginx/html;
  index index.html;

  # Gzip (Brotli needs a custom build; skip for simplicity)
  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;
  gzip_min_length 1024;

  # Security / hygiene headers. No Content-Security-Policy: the page loads
  # Tailwind from cdn.tailwindcss.com and Umami from umami.lav.ren.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # Only production is indexable. This file is an nginx-image template:
  # ${ROBOTS_TAG} is filled from the container env at start — the image defaults
  # to "noindex, nofollow", only the production stack sets it to "" (an empty
  # add_header value is not sent).
  add_header X-Robots-Tag "${ROBOTS_TAG}" always;
  set $robots_tag "${ROBOTS_TAG}";

  # No add_header inside any location below: nginx drops every server-level
  # add_header in a location that declares its own, which would strip the
  # headers above — X-Robots-Tag included.

  # robots.txt follows the same switch: while ROBOTS_TAG is set, every crawler
  # is told to keep out. Production (ROBOTS_TAG="") has no robots.txt file, so
  # it answers 404, which crawlers read as "no restrictions".
  location = /robots.txt {
    default_type text/plain;
    if ($robots_tag) {
      return 200 "User-agent: *\nDisallow: /\n";
    }
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
